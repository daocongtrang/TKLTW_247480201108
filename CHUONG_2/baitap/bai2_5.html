<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng kí thể thao</title>
</head>
<body>
  <table style="width:100%; margin-bottom:20px;">
  <tr>
    <td style="text-align:center; font-weight:bold;">
      TRƯỜNG ĐẠI HỌC BẠC LIÊU<br>
      KHOA KỸ THUẬT VÀ CÔNG NGHỆ
    </td>
    <td style="text-align:center; font-weight:bold;">
      CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br>
      Độc lập - Tự do - Hạnh phúc
    </td>
  </tr>
</table>
  <font face="Verdana" size="3" color="red">
    <h1 align="center"><b>PHIẾU ĐĂNG KÍ DỰ THI THỂ THAO</b> </h1>
  </font>
  <img src="2.png" width="400" height="200">
  <form method="post" action="">
    <p align="center">
      <font face="Time new roman" size="6">Họ tên:</font>
      <input type="text" name="hoten" size="15" value=" " maxlength="15">
    </p>
    <p align="center">
      <font face="Time new roman" size="5">Mật Khẩu:</font>
      <input type="text" name="matkhau" size="15" value=" " maxlength="15">
    </p>
  </form>
  <form method="post" action="">
    <font size="5">
    <p><b>sở thích của bạn:</b></p>
    <p><input type="checkbox" name="st1" value="on">Bóng đá<br>
    <input type="checkbox" name="st2" value="on">Bóng chuyền<br>
    <input type="checkbox" name="st3" value="on">Điền kinh<br>
    <input type="checkbox" name="st4" value="on">Bơi lội<br>
    </p>
    </font>
  </form>
  <hr color="black" size="5">
  <h2 align="center">PHẦN CỨNG MÁY TÍNH</h2>
  <hr color="black" size="2">
  <form method="post" action="">
    <p ><b>THIẾT BỊ:<br></b>
    <select size="4" name="equip" multiple>
        <option value="CPU">CPU</option>
         <option value="Mainboard">Mainboard</option>
          <option value="AsusDVD">Asus DVD</option>
           <option value="RAMkINGMAX">Ram Kingmax</option>
    </select>
    </p>
    <p>Thời gian bảo hành:<br>
    <select size="1" name="year">
         <option value=" "></option>
        <option value="1">1 năm</option>
         <option value="2">2 năm</option>
    </select>
    </p>
    <p>
        <input type="submit" value="submit" name="b1">
        <input type="reset" value="reset" name="b2">
    </p>

  </form>
</body>
</html>
