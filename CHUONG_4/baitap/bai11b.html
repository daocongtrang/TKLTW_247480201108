<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Thay đổi màu nền sử dụng đối tượng document</h1>
    <input type="button" name="1" value="Thay màu xanh dương"
    onclick="document.bgColor='skyblue'">
    <input type="button" name="2" value="Thay màu xanh lá"
    onclick="document.bgColor='green'">
    <input type="button" name="3" value="Thay màu vàng"
    onclick="document.bgColor='yellow'">
</body>
</html>
