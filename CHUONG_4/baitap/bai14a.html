<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hãy nhập hai số và click vào nút tính tổng</h1>
    <input type="text" id="hangso1">
    <input type="text" id="hangso2">
    <input type="text" id="ketqua">
    <input type="button" value="+"
     onclick="document.getElementById('ketqua').value= parseFloat(document.getElementById('hangso1').value)+parseFloat(document.getElementById('hangso2').value)";
    >
    <input type="button" value="-"
    onclick="document.getElementById('ketqua').value= parseFloat(document.getElementById('hangso1').value)-parseFloat(document.getElementById('hangso2').value)";
   >
   <input type="button" value="*"
   onclick="document.getElementById('ketqua').value= parseFloat(document.getElementById('hangso1').value)*parseFloat(document.getElementById('hangso2').value)";
  >
  <input type="button" value="/" onclick="chia()">
  <script>
     function chia() {
        let a = parseFloat(document.getElementById('hangso1').value);
        let b = parseFloat(document.getElementById('hangso2').value);

        if (b == 0) {
            alert("Không thể chia cho 0");
        } else {
            document.getElementById('ketqua').value = a / b;
        }
    }
  </script>
</body>
</html>
