<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x,soluong;
        var ds= new Array(100);
        soluong=prompt("bạn cần nhập bao nhiêu món");
        for( i=0;i<soluong;i++)
         {
            ds[i]=prompt("nhập vào tên:");
         }
         ds.sort();
         document.write("<h1>Danh sách đã sắp xếp là:</h1>");
         for(x in ds)
         {
           if(ds[x]=="computer") 
        { document.write(ds[x]);
            document.write("<br>");
         }
        }
    </script>
</body>
</html>
