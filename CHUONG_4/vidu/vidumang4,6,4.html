<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <script>
        var arr=[7,5,4,3,2,6];
        arr.push(12);   
        document.write(arr.join()+'<br>');
        arr.pop();
        document.write(arr.join()+'<br>');
        arr.unshift(79);
        document.write(arr.join()+'<br>');
        arr.unshift(799);
        document.write(arr.join()+'<br>');
        arr.shift();
        document.write(arr.join()+'<br>');
        document.write(arr.slice(3)+'<br>');
       document.write(arr.sort()+'<br>');
       document.write(arr.reverse()+'<br>');
       

    </script>
    
</body>
</html>
